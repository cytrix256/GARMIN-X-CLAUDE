name: Garmin sync

on:
  schedule:
    # 05:30 UTC daily. GitHub queues cron jobs under load, so treat this as
    # "early morning", not an exact time.
    - cron: "30 5 * * *"
  workflow_dispatch:      # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write         # needed to commit refreshed data back to the repo

concurrency:
  group: garmin-sync      # never let two syncs race on the same commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Garmin data
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: python fetch_garmin_data.py --days 180

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Garmin sync $(date -u +'%Y-%m-%d')"
            git push
          fi
